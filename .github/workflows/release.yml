name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  build-sign-notarize:
    runs-on: macos-26
    timeout-minutes: 30
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          submodules: recursive

      - name: Guard immutable release assets
        id: guard
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { evaluateReleaseAssetGuard } = require('./scripts/release_asset_guard');
            const tag = context.ref.replace('refs/tags/', '');
            core.setOutput('skip_all', 'false');
            core.setOutput('skip_upload', 'false');
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              const existingAssetNames = (release.data.assets || []).map(a => a.name);
              const {
                conflicts,
                missingImmutableAssets,
                guardState,
                hasPartialConflict,
                shouldSkipBuildAndUpload,
              } = evaluateReleaseAssetGuard({ existingAssetNames });
              if (hasPartialConflict) {
                core.setFailed(
                  `Release ${tag} has partial immutable assets. ` +
                  `Existing: ${conflicts.join(', ')}. Missing: ${missingImmutableAssets.join(', ')}. ` +
                  'Resolve manually before rerunning.'
                );
                return;
              }
              if (shouldSkipBuildAndUpload) {
                core.notice(`Release ${tag} already has immutable assets (${conflicts.join(', ')}). Skipping.`);
                core.setOutput('skip_all', 'true');
                core.setOutput('skip_upload', 'true');
                return;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }

      - name: Select Xcode
        if: steps.guard.outputs.skip_all != 'true'
        run: |
          set -euo pipefail
          if [ -d "/Applications/Xcode.app/Contents/Developer" ]; then
            XCODE_DIR="/Applications/Xcode.app/Contents/Developer"
          else
            XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | head -n 1 || true)"
            if [ -n "$XCODE_APP" ]; then
              XCODE_DIR="$XCODE_APP/Contents/Developer"
            else
              echo "No Xcode.app found under /Applications" >&2
              exit 1
            fi
          fi
          echo "DEVELOPER_DIR=$XCODE_DIR" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$XCODE_DIR"
          xcodebuild -version

      - name: Install build deps
        if: steps.guard.outputs.skip_all != 'true'
        run: |
          ZIG_REQUIRED="0.15.2"
          if command -v zig >/dev/null 2>&1 && zig version 2>/dev/null | grep -q "^${ZIG_REQUIRED}"; then
            echo "zig ${ZIG_REQUIRED} already installed"
          else
            echo "Installing zig ${ZIG_REQUIRED}"
            curl -fSL "https://ziglang.org/download/${ZIG_REQUIRED}/zig-aarch64-macos-${ZIG_REQUIRED}.tar.xz" -o /tmp/zig.tar.xz
            tar xf /tmp/zig.tar.xz -C /tmp
            sudo mkdir -p /usr/local/bin /usr/local/lib
            sudo cp -f /tmp/zig-aarch64-macos-${ZIG_REQUIRED}/zig /usr/local/bin/zig
            sudo cp -rf /tmp/zig-aarch64-macos-${ZIG_REQUIRED}/lib /usr/local/lib/zig
            zig version
          fi
          npm install --global create-dmg@8.0.0

      - name: Download pre-built GhosttyKit.xcframework
        if: steps.guard.outputs.skip_all != 'true'
        run: ./scripts/download-prebuilt-ghosttykit.sh

      - name: Cache Swift packages
        if: steps.guard.outputs.skip_all != 'true'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: .spm-cache
          key: spm-${{ hashFiles('GhosttyTabs.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-

      - name: Setup Go
        if: steps.guard.outputs.skip_all != 'true'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: daemon/remote/go.mod

      - name: Build app (Release)
        if: steps.guard.outputs.skip_all != 'true'
        run: |
          xcodebuild -scheme cmux -configuration Release -derivedDataPath build \
            -clonedSourcePackagesDirPath .spm-cache \
            CODE_SIGNING_ALLOWED=NO build

      - name: Build remote daemon release assets
        if: steps.guard.outputs.skip_all != 'true'
        run: |
          set -euo pipefail
          APP_PLIST="build/Build/Products/Release/cmux.app/Contents/Info.plist"
          APP_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PLIST")
          ./scripts/build_remote_daemon_release_assets.sh \
            --version "$APP_VERSION" \
            --release-tag "$GITHUB_REF_NAME" \
            --repo "${{ github.repository }}" \
            --output-dir "remote-daemon-assets"
          MANIFEST_JSON="$(python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1], encoding="utf-8")), separators=(",",":")))' remote-daemon-assets/cmuxd-remote-manifest.json)"
          plutil -remove CMUXRemoteDaemonManifestJSON "$APP_PLIST" >/dev/null 2>&1 || true
          plutil -insert CMUXRemoteDaemonManifestJSON -string "$MANIFEST_JSON" "$APP_PLIST"

      - name: Stamp build metadata
        if: steps.guard.outputs.skip_all != 'true'
        run: |
          APP_PLIST="build/Build/Products/Release/cmux.app/Contents/Info.plist"
          BUILD_SHA="${{ github.sha }}"
          SHORT_SHA="${BUILD_SHA:0:7}"

          # Set choam-io bundle ID (separate defaults domain from upstream)
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier io.choam.cmux" "$APP_PLIST"

          # Stamp build commit for deck doctor
          /usr/libexec/PlistBuddy -c "Set :BuildCommit ${SHORT_SHA}" "$APP_PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :BuildCommit string ${SHORT_SHA}" "$APP_PLIST"

      - name: Import signing certificate
        if: steps.guard.outputs.skip_all != 'true'
        uses: nodeselector/setup-apple-codesign@v0.0.2
        with:
          asset-type: certificate
          secret-value: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Codesign app
        if: steps.guard.outputs.skip_all != 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          APP_PATH="build/Build/Products/Release/cmux.app"
          ENTITLEMENTS="cmux.entitlements"

          # Sign embedded binaries first
          CLI_PATH="$APP_PATH/Contents/Resources/bin/cmux"
          HELPER_PATH="$APP_PATH/Contents/Resources/bin/ghostty"
          if [ -f "$CLI_PATH" ]; then
            /usr/bin/codesign --force --options runtime --timestamp \
              --sign "$APPLE_SIGNING_IDENTITY" --entitlements "$ENTITLEMENTS" "$CLI_PATH"
          fi
          if [ -f "$HELPER_PATH" ]; then
            /usr/bin/codesign --force --options runtime --timestamp \
              --sign "$APPLE_SIGNING_IDENTITY" --entitlements "$ENTITLEMENTS" "$HELPER_PATH"
          fi

          # Sign the app bundle
          /usr/bin/codesign --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" --entitlements "$ENTITLEMENTS" --deep "$APP_PATH"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Notarize app
        if: steps.guard.outputs.skip_all != 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release/cmux.app"
          DMG_RELEASE="cmux-macos-arm64.dmg"

          # Write API key to file for notarytool
          KEY_PATH="$(mktemp)"
          echo "$ASC_KEY" | base64 --decode > "$KEY_PATH"

          # Notarize the app
          ZIP_SUBMIT="cmux-notary.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_SUBMIT"

          xcrun notarytool submit "$ZIP_SUBMIT" \
            --key "$KEY_PATH" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --wait --timeout 30m

          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl -a -vv --type execute "$APP_PATH"
          rm -f "$ZIP_SUBMIT"

          # Create DMG
          create-dmg --identity="$APPLE_SIGNING_IDENTITY" "$APP_PATH" ./
          mv ./cmux*.dmg "$DMG_RELEASE"

          # Notarize the DMG
          xcrun notarytool submit "$DMG_RELEASE" \
            --key "$KEY_PATH" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --wait --timeout 30m

          xcrun stapler staple "$DMG_RELEASE"
          xcrun stapler validate "$DMG_RELEASE"

          rm -f "$KEY_PATH"

      - name: Attest remote daemon assets
        if: steps.guard.outputs.skip_all != 'true'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-path: |
            remote-daemon-assets/cmuxd-remote-darwin-arm64
            remote-daemon-assets/cmuxd-remote-darwin-amd64
            remote-daemon-assets/cmuxd-remote-linux-arm64
            remote-daemon-assets/cmuxd-remote-linux-amd64
            remote-daemon-assets/cmuxd-remote-checksums.txt
            remote-daemon-assets/cmuxd-remote-manifest.json

      - name: Upload artifacts (dry-run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cmux-release-dry-run
          path: |
            cmux-macos-arm64.dmg
            remote-daemon-assets/cmuxd-remote-*
          if-no-files-found: error

      - name: Upload release assets
        if: steps.guard.outputs.skip_upload != 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          files: |
            cmux-macos-arm64.dmg
            remote-daemon-assets/cmuxd-remote-darwin-arm64
            remote-daemon-assets/cmuxd-remote-darwin-amd64
            remote-daemon-assets/cmuxd-remote-linux-arm64
            remote-daemon-assets/cmuxd-remote-linux-amd64
            remote-daemon-assets/cmuxd-remote-checksums.txt
            remote-daemon-assets/cmuxd-remote-manifest.json
          generate_release_notes: true

      - name: Cleanup
        if: always()
        run: |
          security delete-keychain ci.keychain >/dev/null 2>&1 || true
